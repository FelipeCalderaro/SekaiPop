# shellcheck shell=bash disable=SC2034,SC2154
#
# SekaiPop's neofetch look: your Quick Panel banner (or profile picture) as a sticker
# card beside the system info, in the shell's own colours.
#
# Hooked in by neofetch-setup.sh, which makes ~/.config/neofetch/config.conf source this
# file (your old config is kept as config.conf.sekaipop-bak). neofetch sources its
# config AFTER defining all its functions, so this file can also replace two of them
# (get_image_size, make_thumbnail) to draw the card itself.
#
# Which picture: Settings -> General -> Quick Panel -> Neofetch picture, saved as
# "terminal.fetchImage" ("banner" | "avatar") in ~/.config/sekaipop/settings.json.
# SEKAIPOP_FETCH_IMAGE=banner|avatar overrides it for one run. The chosen one missing,
# the other one is used; neither picked (or not in Kitty), the distro logo.
#
# The card: the picture cropped to fit (banner 16:10, avatar square), rounded corners,
# a thick outline in the theme's accent and a hard offset shadow in its second accent,
# the same sticker look as the shell's plates. Colours come from Kitty's
# sekaipop-colors.conf (Settings -> Desktop -> App colours -> Kitty), so the card
# follows the theme. Rendered with ImageMagick and cached in ~/.cache/sekaipop/neofetch.
# Icons need a Nerd Font in the terminal.

__sp_cfg="${XDG_CONFIG_HOME:-$HOME/.config}"
__sp_pics="${XDG_DATA_HOME:-$HOME/.local/share}/sekaipop"
__sp_cache="${XDG_CACHE_HOME:-$HOME/.cache}/sekaipop/neofetch"

# ===== which picture =====
__sp_kind="${SEKAIPOP_FETCH_IMAGE:-}"
if [[ -z "$__sp_kind" && -f "$__sp_cfg/sekaipop/settings.json" ]]; then
    __sp_kind=$(sed -n 's/.*"terminal\.fetchImage" *: *"\([a-z]*\)".*/\1/p' "$__sp_cfg/sekaipop/settings.json")
fi
[[ "$__sp_kind" == avatar ]] || __sp_kind=banner

__sp_newest() { ls -1t "$__sp_pics/$1"-* 2>/dev/null | head -n 1; }
__sp_image=$(__sp_newest "$__sp_kind")
if [[ -z "$__sp_image" ]]; then
    [[ "$__sp_kind" == banner ]] && __sp_kind=avatar || __sp_kind=banner
    __sp_image=$(__sp_newest "$__sp_kind")
fi

# ===== theme colours (fallbacks: the default SekaiPop navy theme) =====
__sp_col() {
    local v
    v=$(sed -n "s/^$1[[:space:]]\{1,\}\(#[0-9a-fA-F]\{6\}\).*/\1/p" "$__sp_cfg/kitty/sekaipop-colors.conf" 2>/dev/null | head -n 1)
    printf '%s' "${v:-$2}"
}
__sp_accent=$(__sp_col active_border_color '#7988d2')
__sp_accent2=$(__sp_col color5 '#c37ebd')

# ===== image or logo =====
if [[ -n "$__sp_image" && ( "$TERM" == xterm-kitty || -n "$KITTY_WINDOW_ID" ) ]]; then
    image_backend="kitty"
    image_source="$__sp_image"
else
    image_backend="ascii"
    image_source="auto"
fi
ascii_distro="auto"
ascii_colors=(4 5)
ascii_bold="on"
gap=3
yoffset=0
xoffset=0

# Sizes the card from the window neofetch measured: about as tall as the info column,
# never more than 45% of the window's width (a narrow window gets a smaller card).
get_image_size() {
    get_term_size
    local num=16 den=10 sh=$((font_height / 2 > 6 ? font_height / 2 : 6))
    [[ "$__sp_kind" == avatar ]] && num=1 den=1
    height=$((font_height * 19))
    ((height > term_height * 85 / 100)) && height=$((term_height * 85 / 100))
    width=$((height * num / den))
    if ((width > term_width * 45 / 100)); then
        width=$((term_width * 45 / 100))
        height=$((width * den / num))
    fi
    __sp_shadow=$sh
    width=$((width + sh))
    height=$((height + sh))
    text_padding="$(((width + padding + xoffset) / font_width + gap))"
}

# Draws the sticker card (cached by picture, size and colours).
make_thumbnail() {
    local sh=${__sp_shadow:-6}
    local w=$((width - sh)) h=$((height - sh))
    local bw=$((w / 45 > 4 ? w / 45 : 4))
    local r=$((w / 14 > 8 ? w / 14 : 8))
    local stamp
    stamp=$(stat -c %Y "$image" 2>/dev/null)
    local key="${image##*/}-${stamp}-${w}x${h}-${sh}-${__sp_accent#\#}-${__sp_accent2#\#}"
    local out="$__sp_cache/card-$key.png"
    mkdir -p "$__sp_cache"
    if [[ ! -f "$out" ]]; then
        rm -f "$__sp_cache"/card-*.png
        local im=magick
        type -p magick &>/dev/null || im=convert
        "$im" "$image" -auto-orient -resize "${w}x${h}^" -gravity center -extent "${w}x${h}" +repage \
            \( -size "${w}x${h}" xc:black -fill white -draw "roundrectangle 0,0,$((w - 1)),$((h - 1)),$r,$r" \) \
            -alpha off -compose CopyOpacity -composite \
            -compose over -fill none -stroke "$__sp_accent" -strokewidth "$bw" \
            -draw "roundrectangle $((bw / 2)),$((bw / 2)),$((w - 1 - bw / 2)),$((h - 1 - bw / 2)),$r,$r" \
            \( -size "${width}x${height}" xc:none -fill "$__sp_accent2" \
               -draw "roundrectangle $sh,$sh,$((width - 1)),$((height - 1)),$r,$r" \) \
            +swap -gravity northwest -geometry +0+0 -composite \
            "$out" 2>/dev/null || { out="$image"; }
    fi
    image="$out"
}

# ===== the info column =====
__sp_dots() {
    local i s=""
    for i in 1 2 3 4 5 6; do s+="\e[3${i}m"" "; done
    printf '%b\e[0m' "$s"
}

print_info() {
    prin "$(color 5)""  "$'\e[1;37m'"${USER}$(color 8) @ $(color 4)${HOSTNAME:-$(uname -n)}"
    prin "$(color 8)────────────────────────────"
    info "  os    " distro
    info "  kernel" kernel
    info 󰅐"  uptime" uptime
    info 󰏖"  pkgs  " packages
    info "  shell " shell
    info "  wm    " wm
    info "  term  " term
    info "  font  " term_font
    info "  cpu   " cpu
    info 󰢮"  gpu   " gpu
    info "  memory" memory
    prin "$(color 8)────────────────────────────"
    prin "$(__sp_dots)"
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="on"
os_arch="off"
uptime_shorthand="tiny"
memory_percent="on"
memory_unit="gib"
package_managers="tiny"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_speed="off"
cpu_cores="off"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
de_version="off"

# title, @, underline, subtitle (the icon + name), colon, info
colors=(5 8 8 4 8 7)
bold="on"
underline_enabled="off"
separator="  "
color_blocks="off"
stdout="off"
